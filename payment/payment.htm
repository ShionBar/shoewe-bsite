<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">
    <title>Cool Kicks</title>
    <script src="https://smtpjs.com/v3/smtp.js"></script>
    <link rel="stylesheet" href="payment.css">
    <link rel="shortcut icon" href="logo.jpg">
</head>

<body>
    <div class="bg"></div>
    <div class="container">

        <form id="paymentForm" action="#">

            <div class="row">

                <div class="col">
                    <!-- <h3 class="title">
                        Payment
                    </h3> -->

                    <div class="inputBox">
                        <label for="name">
                              Full Name:
                          </label>
                        <input type="text" id="name" 
                               placeholder="Enter your full name" 
                               required>
                    </div>
                    <div class="inputBox">
                        <label for="contactNumber">
                              Contact Number:
                          </label>
                        <input type="number" id="contactNumber" 
                               placeholder="Enter contact number" 
                               required>
                    </div>
                    <div class="inputBox">
                        <label for="email">
                              Email:
                          </label>
                        <input type="text" id="email" 
                               placeholder="Enter email address" 
                               required>
                    </div>

                    <div class="inputBox">
                        <label for="address">
                              Address:
                          </label>
                        <input type="text" id="address" 
                               placeholder="Enter address" 
                               required>
                    </div>

                    <div class="inputBox">
                        <label for="city">
                              City:
                          </label>
                        <input type="text" id="city" 
                               placeholder="Enter city" 
                               required>
                    </div>
                    <div class="inputBox">
                        <label for="zip">
                              Zip Code:
                          </label>
                        <input type="number" id="zip" 
                               placeholder="123 456" 
                               required>
                    </div>
                </div>
                <div class="col">
                    <!-- <h3 class="title">Payment</h3> -->

                    <div class="inputBox">
                        <label for="">Payment Option</label>
                        <select name="" id="paymentOption">
                            <option value="COD/Cash On Delivery">COD/Cash On Delivery</option>
                            <option value="GCash (Not yet available)">GCash (Not yet available)</option>
                            <option value="Maya (Not yet available)">Maya (Not yet available)</option>
                        </select>
                    </div>
                </div>

            </div>

            <input type="button" value="Proceed to Checkout" 
                   class="submit_btn">
        </form>

    </div>
    <script src="payment.js"></script>
    <script src="../products/scrip.js"></script>
    
</body>

</html>
